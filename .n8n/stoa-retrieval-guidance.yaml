purpose: >-
  Retrieve evidence for a conversational Stoic mentor, addressing the tool question's
  specific point. Return sources for the answering agent to evaluate, not a prose answer.

retrieval_strategy:
  selection: Choose the first matching route below, based on the requested result.
  routes:
    - >-
      Direct lookup: a request for a specific passage by known ID or citation. Retrieve
      its rendering without imposing the text-first school or report-mode defaults.
    - >-
      Entity resolution: a request only to identify people, works, concepts, practices,
      or theses and their IDs. Return matching entities for a later evidence lookup.
    - >-
      Doctrine-first: a request to inspect a named/resolved teaching or practice and its
      evidence, or graph claims such as "Which practices are linked as remedies for anger?"
      Explicit requests for doctrinal evidence or relationships take precedence over
      practical framing. Resolve the entities, then follow incoming DISCUSSES links or
      assertion evidence Passage IDs to renderings. Start with direct links; expand
      only when the question requires it.
    - >-
      Text-first: otherwise, practical advice or relevant quotations, such as "How can
      I manage my anger?" Search Rendering.text for the particular situation or claim;
      mentioning a philosophical topic alone does not require doctrine-first retrieval.
  entity_resolution: >-
    Use Searchable.name/search_text to resolve names and aliases, and exact indexed IDs
    when supplied. Never invent IDs or citations. Resolution is an intermediate step
    when the requested result is evidence, not an entity list.
  text_search: >-
    Generate a few discriminating terms with older English alternatives, such as
    anger | wrath. Do not copy the whole question or its punctuation/operators into
    the search expression: Cypher parameters do not escape full-text query syntax.
  scope:
    - >-
      Honor explicit author, work, citation, language, report-mode, and exclusion filters
      before LIMIT, including already-seen passage IDs. For a named teacher, filter
      REPORTS, not just AUTHORED, which may identify a recorder or compiler. Never
      substitute another author when a targeted search is empty.
    - >-
      Only text-first retrieval defaults to English renderings (lang = en) reporting a
      Person linked by MEMBER_OF to School named Stoa, with REPORTS.mode own_words or
      recorded_teaching. Explicit witness/non-Stoic requests override these defaults.
      This policy does not establish doctrinal endorsement: a passage may quote an opponent.
    - >-
      Doctrine-linked evidence retains cited witnesses, including non-Stoic sources,
      doxography, and paraphrase, subject to explicit restrictions. Such a witness
      discussing an idea does not establish that it is Stoic teaching.
  ranking: >-
    Normally return three candidates, never exceeding the supplied node limit or a smaller
    requested count. Order full-text results by score descending with stable ID tie-breaks.
    Scores measure lexical matching, not philosophical relevance or quotation quality.
    A low score or empty search does not prove absence of a teaching; reformulation is
    the calling agent's job. Prefer concise evidence at comparable relevance, without
    excluding relevant long passages solely for length.
  renderings: >-
    Prefer one rendering per passage in the requested language, choosing extent full
    when equivalents exist, unless translation comparison is requested. Aggregate
    attribution before returning rows so fan-out does not consume the candidate limit.

doctrinal_provenance:
  - >-
    basis extracted means an unreviewed machine proposal, even if its supporting quotation
    exactly matches the source. Textual presence is not proof of entailment, attribution,
    or philosophical correctness. Never relabel extracted as ancient or omit its basis
    to make an answer seem authoritative. Include extracted in exploratory assertion
    retrieval, with provisional = true; honor requests that explicitly exclude it.
  - >-
    basis ancient, scholarly, and editorial must also retain their distinct meanings.
    Return each assertion's direction, basis, evidence Passage IDs, extractor, extracted_at,
    scholarly_ref, note, and evidence_records when present. For HOLDS, also return stance;
    affirms, denies, and modifies are not interchangeable or school-wide consensus.
  - >-
    Concept.definition, Practice.description, and Thesis.statement are interpretive
    summaries, not ancient quotations. Return their review_status, extractor, extracted_at,
    and description_record when using them. Missing review metadata does not establish
    scholarly approval. Generated labels and taxonomy edges are provisional too; a
    Passion label alone does not identify one of the four canonical generic passions.
  - >-
    DISCUSSES and INVOLVES are structural links and have no assertion basis. Generated
    links can carry extractor, extracted_at, and evidence_records. Preserve those fields
    without inventing basis ancient. DISCUSSES.focus mention establishes an indexing
    lead, not endorsement of the topic or support for its entire summary.
  - >-
    Node source_passages/source_renderings can merge evidence from multiple variants.
    Do not assume every linked passage supports the representative description.
    description_record and evidence_records identify external provenance records; they
    are not quotation text and are not themselves resolvable by this graph query tool.
    Resolve source IDs to actual renderings and let the answering agent evaluate support.
  - >-
    Use UNWIND on an assertion's evidence IDs and indexed Passage.id matches. For evidence
    retrieval, require an actual rendering; empty evidence produces no quotable row.
    For an explicit assertion inventory, OPTIONAL MATCH may preserve unsupported claims
    with null text and an explicit indication that no passage was retrieved.
  - >-
    Use bounded paths only when required by the question. Filter every assertion hop by
    the allowed bases and return provenance for every hop; evidence for a REMEDIES edge
    does not also validate a traversed SPECIES_OF edge. Do not rank truth by path length,
    PageRank, mention count, or extraction frequency. Do not collapse conflicting claims
    or promote the most frequently extracted one to a consensus.

attribution:
  - >-
    Return AUTHORED names/roles and REPORTS names/modes as separate lists of maps.
    Keep missing attribution absent or null; missing authorship must not suppress a
    passage. Obtain names, titles, translations, and citations from the graph, never
    familiarity with a quotation.
  - >-
    A reported philosopher is not necessarily the author or speaker of every sentence.
    Doxography, paraphrase, and hostile reports must not become that philosopher's direct
    quotation. Even verbatim_quote and quoted_in_translation do not identify exact quote
    boundaries within a rendering; retain the whole context for the answering agent.

result_contract:
  passage_fields:
    - text
    - passage_id
    - rendering_id
    - citation
    - work_id
    - work_title
    - authorship
    - reported_voices
    - language
    - extent
    - translator
    - license
  text: >-
    Return the entire stored Rendering.text unchanged, separate from interpretation
    fields. Do not summarize, substring, stitch renderings together, or insert ellipses.
    This is source context; the answering agent may quote a shorter contiguous excerpt
    of complete, self-contained sentences. A citation or entity summary alone is not
    quotable evidence.
  score: Include only scores supplied by a search procedure; never invent semantic scores.
  doctrine_context: >-
    Whenever doctrinal links are used, include provenance even if not requested. For
    topic retrieval, return its ID, name, interpretation, and the node/link metadata
    specified in doctrinal_provenance, including DISCUSSES.focus. A provisional flag
    means machine-generated or unreviewed, not that the passage is false.
  assertions: >-
    Return a list of maps with source/target IDs and names, relationship, and applicable
    fields in doctrinal_provenance. Each assertion accompanying evidence text must cite that
    row's passage. Entity resolution and explicit inventories may return rows without
    text under the rules above; do not present those as retrieved quotations.

properties:
  Entity: id is the unique string identifier; name is the display name.
  Searchable: search_text contains prepared names and aliases for full-text resolution.
  Person: >-
    Optional name_original, born, died, floruit, stoa_phase, aliases, bio. Dates are signed
    years; aliases is a string array. School affiliation is a MEMBER_OF relationship.
  Work: Optional title_original, abbreviation, cts_urn, extant, aliases.
  Concept: Optional term_original, latin, aliases, object_value, time, note.
  Practice: Optional term_original, coined_by, aliases, note.
  Thesis: statement; optional aliases.
  Passage: >-
    citation and ref identify a location; optional cts_urn and concordance (string array).
    Text lives on Rendering, not Passage.
  Rendering: >-
    Optional translator, edition, embedding, embedding_hash, embedding_model.
    extent full describes the stored rendering, not the length of a chat quotation.

indexes:
  fulltext:
    Searchable: [name, search_text]
    Rendering: [text]
  guidance: >-
    db.idx.fulltext.queryNodes(label, searchText) yields node and score.
    Entity.id supports exact indexed lookup.

examples:
  person_by_id:
    question: >-
      What are the name, floruit, and Stoa phase of the previously identified person:chrysippus?
    purpose: Exact entity lookup; returns biographical fields, not quotation evidence.
    parameters:
      person_id: person:chrysippus
      limit: 1
    cypher: |-
      MATCH (person:Person {id: $person_id})
      RETURN person.id AS id, person.name AS name, person.floruit AS floruit,
             person.stoa_phase AS stoa_phase
      LIMIT $limit

  people_by_phase:
    question: List up to three people from the early Stoa phase, ordered by name.
    purpose: Filter entity properties without a search procedure or relevance score.
    parameters:
      phase: early
      limit: 3
    cypher: |-
      MATCH (person:Person)
      WHERE person.stoa_phase = $phase
      RETURN person.id AS id, person.name AS name
      ORDER BY name, id LIMIT $limit

  schools_for_person:
    question: >-
      Which schools is the previously identified person:chrysippus a member of?
      Return up to three, ordered by name.
    purpose: Follow one structural relationship in its defined direction.
    parameters:
      person_id: person:chrysippus
      limit: 3
    cypher: |-
      MATCH (person:Person {id: $person_id})-[:MEMBER_OF]->(school:School)
      RETURN DISTINCT school.id AS id, school.name AS name
      ORDER BY name, id LIMIT $limit

  works_for_person:
    question: >-
      List up to three works associated with the previously identified person:seneca,
      ordered by title, and identify his role as author, recorder, or compiler for each.
    purpose: Return work metadata with explicit authorship roles, without retrieving passages.
    parameters:
      person_id: person:seneca
      limit: 3
    cypher: |-
      MATCH (person:Person {id: $person_id})-[auth:AUTHORED]->(work:Work)
      RETURN work.id AS work_id, work.name AS work_title,
             collect(DISTINCT {name: person.name, role: auth.role}) AS authorship
      ORDER BY work_title, work_id LIMIT $limit

  stoic_passages:
    question: >-
      Find up to three English passages about anger or wrath from Stoic voices in their
      own words or recorded teaching, with the source text and attribution.
    purpose: >-
      Text-first search with default scope. Add requested filters before the first LIMIT.
    parameters:
      term: anger | wrath
      language: en
      school: Stoa
      modes: [own_words, recorded_teaching]
      limit: 3
    cypher: |-
      CALL db.idx.fulltext.queryNodes('Rendering', $term) YIELD node, score
      MATCH (node)-[:RENDERS]->(p:Passage)-[:PART_OF]->(w:Work)
      MATCH (p)-[report:REPORTS]->(speaker:Person)-[:MEMBER_OF]->(school:School)
      WHERE node.lang = $language AND school.name = $school AND report.mode IN $modes
      WITH DISTINCT node, score, p, w
      ORDER BY score DESC, CASE node.extent WHEN 'full' THEN 0 ELSE 1 END, node.id
      WITH p, w, collect(node)[0] AS node, max(score) AS score
      ORDER BY score DESC, p.id LIMIT $limit
      OPTIONAL MATCH (writer:Person)-[auth:AUTHORED]->(w)
      WITH node, score, p, w,
           collect(DISTINCT CASE WHEN writer IS NULL THEN null
             ELSE {name: writer.name, role: auth.role} END) AS authorship
      OPTIONAL MATCH (p)-[report:REPORTS]->(voice)
      RETURN node.text AS text, p.id AS passage_id, node.id AS rendering_id,
             p.citation AS citation, w.id AS work_id, w.name AS work_title, authorship,
             collect(DISTINCT CASE WHEN voice IS NULL THEN null
               ELSE {name: voice.name, mode: report.mode} END) AS reported_voices,
             node.lang AS language, node.extent AS extent, node.translator AS translator,
             node.license AS license, score
      ORDER BY score DESC, passage_id, rendering_id LIMIT $limit

  resolve_entity:
    question: >-
      Find up to three concepts, practices, or theses matching "anger" and return their
      IDs for a later evidence lookup.
    purpose: >-
      Entity resolution; choose kinds for the question and reuse returned IDs.
    parameters:
      name: anger
      kinds: [Concept, Practice, Thesis]
      limit: 3
    cypher: |-
      CALL db.idx.fulltext.queryNodes('Searchable', $name) YIELD node, score
      WITH node, score WHERE any(label IN labels(node) WHERE label IN $kinds)
      RETURN node.id AS id, node.name AS name,
             [label IN labels(node) WHERE NOT label IN ['Entity', 'Searchable']] AS kinds,
             coalesce(node.definition, node.description, node.statement) AS interpretation,
             node.review_status AS review_status, node.extractor AS extractor,
             node.extracted_at AS extracted_at, node.description_record AS description_record, score
      ORDER BY score DESC, id LIMIT $limit

  topic_passages:
    question: >-
      Show up to three English passages discussing the previously resolved topic concept:orge.
    purpose: >-
      Doctrine-first retrieval through DISCUSSES, ordered by stable IDs without a relevance score.
    parameters:
      topic_id: concept:orge
      language: en
      limit: 3
    cypher: |-
      MATCH (topic:Entity {id: $topic_id})<-[link:DISCUSSES]-(p:Passage)-[:PART_OF]->(w:Work)
      MATCH (node:Rendering)-[:RENDERS]->(p)
      WHERE node.lang = $language
      WITH topic, link, p, w, node
      ORDER BY CASE node.extent WHEN 'full' THEN 0 ELSE 1 END, node.id
      WITH topic, link, p, w, collect(node)[0] AS node
      ORDER BY p.id LIMIT $limit
      WITH node, p, w,
           {topic_id: topic.id, topic_name: topic.name,
            interpretation: coalesce(topic.definition, topic.description, topic.statement),
            review_status: topic.review_status, extractor: topic.extractor,
            extracted_at: topic.extracted_at, description_record: topic.description_record,
            focus: link.focus, link_extractor: link.extractor,
            link_extracted_at: link.extracted_at, link_evidence_records: link.evidence_records,
            provisional: CASE WHEN topic.review_status = 'unreviewed'
              OR topic.extractor IS NOT NULL OR link.extractor IS NOT NULL THEN true ELSE null END}
           AS doctrine_context
      OPTIONAL MATCH (writer:Person)-[auth:AUTHORED]->(w)
      WITH node, p, w, doctrine_context,
           collect(DISTINCT CASE WHEN writer IS NULL THEN null
             ELSE {name: writer.name, role: auth.role} END) AS authorship
      OPTIONAL MATCH (p)-[report:REPORTS]->(voice)
      RETURN node.text AS text, p.id AS passage_id, node.id AS rendering_id,
             p.citation AS citation, w.id AS work_id, w.name AS work_title, authorship,
             collect(DISTINCT CASE WHEN voice IS NULL THEN null
               ELSE {name: voice.name, mode: report.mode} END) AS reported_voices,
             node.lang AS language, node.extent AS extent, node.translator AS translator,
             node.license AS license, doctrine_context
      ORDER BY passage_id, rendering_id LIMIT $limit

  assertion_evidence:
    question: >-
      For the previously resolved passion concept:orge, show up to three English evidence
      passages for proposed remedies, including unreviewed extracted claims and their provenance.
    purpose: >-
      Doctrine-first retrieval through assertion evidence. Adapt relationship_types
      (for example APPLIES or HOLDS) to the question. Direct neighbors use stable passage
      ordering, not a semantic ranking.
    parameters:
      topic_id: concept:orge
      relationship_types: [REMEDIES]
      bases: [ancient, scholarly, editorial, extracted]
      language: en
      limit: 3
    cypher: |-
      MATCH (topic:Entity {id: $topic_id})-[claim]-(other)
      WHERE type(claim) IN $relationship_types AND claim.basis IN $bases
      UNWIND claim.evidence AS pid
      MATCH (p:Passage {id: pid})-[:PART_OF]->(w:Work)
      WITH p, w,
           collect(DISTINCT {source_id: startNode(claim).id, source_name: startNode(claim).name,
             relationship: type(claim), target_id: endNode(claim).id, target_name: endNode(claim).name,
             basis: claim.basis, provisional: CASE WHEN claim.basis = 'extracted' THEN true ELSE null END,
             stance: claim.stance, evidence: claim.evidence, extractor: claim.extractor,
             extracted_at: claim.extracted_at, evidence_records: claim.evidence_records,
             scholarly_ref: claim.scholarly_ref, note: claim.note}) AS assertions
      MATCH (node:Rendering)-[:RENDERS]->(p)
      WHERE node.lang = $language
      WITH p, w, assertions, node
      ORDER BY CASE node.extent WHEN 'full' THEN 0 ELSE 1 END, node.id
      WITH p, w, assertions, collect(node)[0] AS node
      ORDER BY p.id LIMIT $limit
      OPTIONAL MATCH (writer:Person)-[auth:AUTHORED]->(w)
      WITH node, p, w, assertions,
           collect(DISTINCT CASE WHEN writer IS NULL THEN null
             ELSE {name: writer.name, role: auth.role} END) AS authorship
      OPTIONAL MATCH (p)-[report:REPORTS]->(voice)
      RETURN node.text AS text, p.id AS passage_id, node.id AS rendering_id,
             p.citation AS citation, w.id AS work_id, w.name AS work_title, authorship,
             collect(DISTINCT CASE WHEN voice IS NULL THEN null
               ELSE {name: voice.name, mode: report.mode} END) AS reported_voices,
             node.lang AS language, node.extent AS extent, node.translator AS translator,
             node.license AS license, assertions
      ORDER BY passage_id, rendering_id LIMIT $limit

  passage_by_id:
    question: >-
      Fetch one English rendering of passage:gs:91 returned by an earlier search,
      with its citation and attribution.
    purpose: >-
      Direct passage lookup with no default school or report-mode filters.
    parameters:
      passage_id: passage:gs:91
      language: en
      limit: 1
    cypher: |-
      MATCH (node:Rendering)-[:RENDERS]->(p:Passage {id: $passage_id})-[:PART_OF]->(w:Work)
      WHERE node.lang = $language
      WITH node, p, w
      ORDER BY CASE node.extent WHEN 'full' THEN 0 ELSE 1 END, node.id LIMIT $limit
      OPTIONAL MATCH (writer:Person)-[auth:AUTHORED]->(w)
      WITH node, p, w,
           collect(DISTINCT CASE WHEN writer IS NULL THEN null
             ELSE {name: writer.name, role: auth.role} END) AS authorship
      OPTIONAL MATCH (p)-[report:REPORTS]->(voice)
      RETURN node.text AS text, p.id AS passage_id, node.id AS rendering_id,
             p.citation AS citation, w.id AS work_id, w.name AS work_title, authorship,
             collect(DISTINCT CASE WHEN voice IS NULL THEN null
               ELSE {name: voice.name, mode: report.mode} END) AS reported_voices,
             node.lang AS language, node.extent AS extent, node.translator AS translator,
             node.license AS license
      ORDER BY CASE extent WHEN 'full' THEN 0 ELSE 1 END, rendering_id LIMIT $limit

engine_constraints:
  - Generate one read-only FalkorDB openCypher query with parameterized question values per call.
  - Use bounded variable-length traversals; avoid graph-wide scans for ordinary text searches.
  - Do not use APOC, CALL subqueries, or Neo4j-specific search procedures.
  - Do not alias a returned column with a variable name subsequently used by ORDER BY.
  - Empty results are valid; do not invent results.
  - >-
    No query embedding is supplied. Use full-text search and traversal rather than
    vector search; do not invent vectors or substitute stored document vectors
    for a question embedding. Never return embedding arrays.
